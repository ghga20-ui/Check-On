<!doctype html><meta charset="utf-8"><style>td,th{border:1px solid #aaa;padding:12px;min-width:40px} [role=dialog]{position:fixed;top:60px;left:160px;background:white;border:1px solid;padding:20px;z-index:10}textarea{width:250px}</style>
<button role="tab">일일출결관리(담임용)</button><input aria-label="학년도" value="2026"><input aria-label="계열/학년/학과" value="2"><input aria-label="반" value="1"><input aria-label="일자" value="2026-09-16"><button onclick="draw()">조회</button><button onclick="save()">저장</button><table><thead><tr><th>번호</th><th>성명</th><th>마감</th><th>조회</th><th>1교시</th><th>2교시</th><th>종례</th><th>사유</th></tr></thead><tbody></tbody></table>
<script>
let persisted=[{n:1,c:'',am:'',pm:'',reason:''},{n:2,c:'',am:'',pm:'',reason:''}];window.saves=0;window.corrupt=false;
function draw(){document.querySelector('tbody').innerHTML=persisted.map(r=>`<tr><td>${r.n}</td><td>합성학생</td><td onclick="popup(this)">${r.c}</td><td onclick="this.textContent=this.textContent?'':'/'">${r.am}</td><td></td><td></td><td onclick="this.textContent=this.textContent?'':'/'">${r.pm}</td><td><textarea></textarea></td></tr>`).join('');document.querySelectorAll('tbody textarea').forEach((t,i)=>t.value=persisted[i].reason)}
function popup(cell){window.target=cell.closest('tr');let d=document.createElement('div');d.role='dialog';d.setAttribute('aria-label','출결마감구분');d.innerHTML='<h2>출결마감구분</h2>'+['결석','지각','조퇴','결과'].map(s=>`<label><input name="kind" value="${s}" type="radio">${s}</label>`).join('')+'<br>'+['질병','미인정','기타','출석인정'].map(s=>`<label><input name="category" value="${s}" type="radio">${s}</label>`).join('')+'<br><input aria-label="사유" maxlength="1000"><button onclick="apply(this)">적용</button>';document.body.append(d)}
function apply(button){let d=button.parentElement;target.cells[2].textContent=d.querySelector('[name=category]:checked').value+d.querySelector('[name=kind]:checked').value;target.querySelector('textarea').value=d.querySelector('[aria-label=사유]').value;if(corrupt)target.cells[4].textContent='/';d.remove()}
function save(){window.saves++;persisted=[...document.querySelectorAll('tbody tr')].map(r=>({n:Number(r.cells[0].textContent),c:r.cells[2].textContent,am:r.cells[3].textContent,pm:r.cells[6].textContent,reason:r.querySelector('textarea').value}));let d=document.createElement('div');d.role='dialog';d.innerHTML='<p>저장했습니다.</p><button onclick="this.parentElement.remove()">확인</button>';document.body.append(d)}draw();
</script>
